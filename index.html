<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Gustavo Felix | Intro</title>
  <meta name="description" content="IntroduÃ§Ã£o do portfÃ³lio de Gustavo Felix.">
  <style>
    :root {
      --bg-1: #020b1c;
      --bg-2: #021637;
      --accent: #00e998;
      --text: #f3f8ff;
      --muted: #b9c8dd;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Manrope", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(760px 460px at 72% 18%, rgba(10, 116, 189, 0.34), transparent 68%),
        radial-gradient(560px 400px at 18% 68%, rgba(0, 233, 152, 0.18), transparent 70%),
        linear-gradient(120deg, var(--bg-1) 0%, #02112a 46%, var(--bg-2) 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .intro {
      width: min(1120px, 92vw);
      padding: 44px 26px;
      text-align: center;
    }

    .typing-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
    }

    .intro-name {
      font-size: clamp(34px, 5vw, 80px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      color: var(--accent);
    }

    .typing {
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      font-size: clamp(20px, 2.4vw, 38px);
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: var(--text);
      border-right: 3px solid var(--accent);
      padding-right: 4px;
      animation: cursor 0.8s step-end infinite;
    }

    .typing .accent {
      color: var(--accent);
    }

    .hint {
      margin-top: 20px;
      color: var(--muted);
      font-size: clamp(14px, 1.2vw, 20px);
    }

    .skip {
      margin-top: 26px;
      display: inline-block;
      border: 1px solid rgba(0, 233, 152, 0.55);
      border-radius: 10px;
      background: rgba(2, 16, 38, 0.72);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 15px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .skip:hover {
      background: rgba(0, 233, 152, 0.14);
      transform: translateY(-1px);
    }

    @keyframes cursor {
      50% { border-color: transparent; }
    }

    @media (max-width: 840px) {
      .typing {
        white-space: normal;
        font-size: clamp(18px, 5.2vw, 30px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing {
        animation: none;
        border-right: none;
      }
    }
  </style>
</head>
<body>
  <main class="intro" aria-label="Introdução do portfólio">
    <h1 class="intro-name">Gustavo Felix</h1>
    <div class="typing-wrap" aria-live="polite">
      <h2 class="typing" id="typing-target" aria-label="Redirecionando ao Portfólio"></h2>
    </div>
    <button class="skip" type="button" id="skip-intro">Entrar agora</button>
  </main>

  <script>
    (function () {
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fullText = "Redirecionando ao Portfólio";
      const target = document.getElementById("typing-target");
      const baseDelay = prefersReducedMotion ? 0 : 90;
      const postTypingPause = prefersReducedMotion ? 1400 : 2800;
      const goToPortfolio = function () {
        window.location.href = "portfolio.html";
      };

      if (prefersReducedMotion) {
        target.textContent = fullText;
      } else {
        let index = 0;
        const timer = window.setInterval(function () {
          index += 1;
          const typed = fullText.slice(0, index);
          const splitToken = " - ";
          const tokenIndex = typed.indexOf(splitToken);

          if (tokenIndex === -1) {
            target.textContent = typed;
          } else {
            const left = typed.slice(0, tokenIndex + splitToken.length);
            const right = typed.slice(tokenIndex + splitToken.length);
            target.innerHTML = left + "<span class=\"accent\">" + right + "</span>";
          }

          if (index >= fullText.length) {
            window.clearInterval(timer);
          }
        }, baseDelay);
      }

      document.getElementById("skip-intro").addEventListener("click", goToPortfolio);
      window.setTimeout(goToPortfolio, (fullText.length * baseDelay) + postTypingPause);
    })();
  </script>
</body>
</html>
